[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
board_build.partitions = default.csv
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  paulstoffregen/XPT2046_Touchscreen @ ^1.4
build_flags =
  -DUSER_SETUP_LOADED
  -include User_Setup.h
